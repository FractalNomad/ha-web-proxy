name: HACS validation

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # HACS data is refreshed periodically; re-validate daily so a
    # requirement change upstream (or a broken tag) surfaces here.
    - cron: "0 3 * * *"
  # Manual trigger: "Run workflow" → pick a category → Run.
  workflow_dispatch:
    inputs:
      category:
        description: HACS repository category
        required: true
        default: integration
        type: choice
        options:
          - integration

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          # NOTE: the input is 'github_token' (underscore). The action reads
          # $INPUT_GITHUB_TOKEN; a hyphen ('github-token') is rejected and the
          # action then validates UNAUTHENTICATED, which cannot resolve the
          # repo's git tree -> 'brands'/'topics' checks falsely fail.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          category: ${{ github.event.inputs.category || 'integration' }}
