<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!--
    HA Proxy integration icon.
    Concept: a globe (the internet / external service) whose traffic flows
    through a central gateway node (the proxy) and out to the right.
    Designed at 256×256, works at 48×48 and smaller.
  -->

  <!-- Globe on the left -->
  <circle cx="68" cy="128" r="44" stroke="#0288D1" stroke-width="10" fill="none"/>
  <!-- Latitude lines -->
  <ellipse cx="68" cy="128" rx="22" ry="44" stroke="#0288D1" stroke-width="7" fill="none"/>
  <!-- Horizontal axis of globe -->
  <line x1="24" y1="128" x2="112" y2="128" stroke="#0288D1" stroke-width="7"/>

  <!-- Arrow shaft from globe to gateway -->
  <line x1="114" y1="128" x2="146" y2="128" stroke="#01579B" stroke-width="9" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <polyline points="140,118 152,128 140,138"
            stroke="#01579B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Gateway / proxy node (rounded square) -->
  <rect x="152" y="100" width="56" height="56" rx="12" ry="12"
        fill="#0288D1" stroke="none"/>
  <!-- HA-style "connected dots" inside the gateway -->
  <circle cx="168" cy="122" r="6" fill="white"/>
  <circle cx="192" cy="122" r="6" fill="white"/>
  <circle cx="180" cy="142" r="6" fill="white"/>
  <line x1="168" y1="122" x2="192" y2="122" stroke="white" stroke-width="3"/>
  <line x1="168" y1="122" x2="180" y2="142" stroke="white" stroke-width="3"/>
  <line x1="192" y1="122" x2="180" y2="142" stroke="white" stroke-width="3"/>

  <!-- Arrow out of gateway to the right -->
  <line x1="208" y1="128" x2="234" y2="128" stroke="#01579B" stroke-width="9" stroke-linecap="round"/>
  <polyline points="226,118 238,128 226,138"
            stroke="#01579B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
